description: >-
  Installs and enables UFW (Uncomplicated Firewall), applying default
  incoming/outgoing policies and an allowlist of ports before enabling.
  Debian/Ubuntu only - UFW isn't packaged for RedHat-family distros, which
  use firewalld instead.
supported_os:
  - "Ubuntu 22.04"
  - "Ubuntu 24.04"
  - "Debian 12"
