---
# No apt/dnf package covers every supported distro consistently, so this
# installs the official GitHub release binary directly, same approach as
# capabilities/service-roles/traefik/linux.yml uses for Traefik.
- name: Set CoreDNS role defaults
  set_fact:
    coredns_version: "{{ service_roles.coredns.config.version | default('1.14.6') }}"
    coredns_port: "{{ service_roles.coredns.config.port | default('53') }}"
    coredns_forwarders: "{{ service_roles.coredns.config.forwarders | default('1.1.1.1,1.0.0.1') }}"

- name: Determine architecture suffix
  set_fact:
    coredns_arch: "{{ 'arm64' if ansible_facts.architecture == 'aarch64' else 'amd64' }}"

- name: Check if CoreDNS binary is already installed
  stat:
    path: /usr/local/bin/coredns
  register: coredns_binary

- name: Set CoreDNS release URL
  set_fact:
    coredns_release_url: >-
      {{ 'https://github.com/coredns/coredns/releases/download/v' ~
         coredns_version ~ '/coredns_' ~ coredns_version ~
         '_linux_' ~ coredns_arch ~ '.tgz' }}

- name: Download and extract CoreDNS binary
  unarchive:
    src: "{{ coredns_release_url }}"
    dest: /usr/local/bin
    remote_src: true
    include: coredns
    mode: "0755"
  when: not coredns_binary.stat.exists

- name: Create coredns system group
  group:
    name: coredns
    system: true
    state: present

- name: Create coredns system user
  user:
    name: coredns
    group: coredns
    system: true
    shell: /usr/sbin/nologin
    home: /var/lib/coredns
    create_home: false
    state: present

- name: Create CoreDNS config directory
  file:
    path: /etc/coredns
    state: directory
    owner: coredns
    group: coredns
    mode: "0755"

- name: Configure Corefile
  copy:
    dest: /etc/coredns/Corefile
    content: |
      .:{{ coredns_port }} {
          forward . {{ coredns_forwarders.split(',') | map('trim') | reject('equalto', '') | join(' ') }}
          cache 30
          log
          errors
      }
    owner: coredns
    group: coredns
    mode: "0644"
  register: coredns_config_changed

- name: Install CoreDNS systemd unit
  copy:
    dest: /etc/systemd/system/coredns.service
    content: |
      [Unit]
      Description=CoreDNS
      After=network.target

      [Service]
      User=coredns
      Group=coredns
      ExecStart=/usr/local/bin/coredns -conf /etc/coredns/Corefile
      Restart=on-failure
      AmbientCapabilities=CAP_NET_BIND_SERVICE

      [Install]
      WantedBy=multi-user.target
    mode: "0644"
  register: coredns_unit_changed

- name: Reload systemd daemon
  systemd:
    daemon_reload: true
  when: coredns_unit_changed.changed

- name: Enable and start CoreDNS service
  systemd:
    name: coredns
    enabled: true
    state: started

- name: Restart CoreDNS after config change
  systemd:
    name: coredns
    state: restarted
  when: coredns_config_changed.changed and not coredns_unit_changed.changed

- name: Debug - CoreDNS installed
  debug:
    msg: "CoreDNS {{ coredns_version }} installed and running on :{{ coredns_port }} (forwarding to {{ coredns_forwarders }})"
