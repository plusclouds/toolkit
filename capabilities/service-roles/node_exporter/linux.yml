---
# No apt/dnf package covers every supported distro consistently, so this
# installs the official GitHub release binary directly, same approach as
# capabilities/service-roles/prometheus/linux.yml uses for Prometheus.
- name: Set node_exporter role defaults
  set_fact:
    node_exporter_version: "{{ service_roles.node_exporter.config.version | default('1.12.1') }}"

- name: Determine architecture suffix
  set_fact:
    node_exporter_arch: "{{ 'arm64' if ansible_facts.architecture == 'aarch64' else 'amd64' }}"

- name: Check if node_exporter binary is already installed
  stat:
    path: /usr/local/bin/node_exporter
  register: node_exporter_binary

- name: Set node_exporter release URL
  set_fact:
    node_exporter_release_url: >-
      {{ 'https://github.com/prometheus/node_exporter/releases/download/v' ~
         node_exporter_version ~ '/node_exporter-' ~ node_exporter_version ~
         '.linux-' ~ node_exporter_arch ~ '.tar.gz' }}

- name: Download and extract node_exporter release
  unarchive:
    src: "{{ node_exporter_release_url }}"
    dest: /opt
    remote_src: true
  when: not node_exporter_binary.stat.exists

- name: Create node_exporter system group
  group:
    name: node_exporter
    system: true
    state: present

- name: Create node_exporter system user
  user:
    name: node_exporter
    group: node_exporter
    system: true
    shell: /usr/sbin/nologin
    home: /nonexistent
    create_home: false
    state: present

- name: Install node_exporter binary
  copy:
    src: "/opt/node_exporter-{{ node_exporter_version }}.linux-{{ node_exporter_arch }}/node_exporter"
    dest: /usr/local/bin/node_exporter
    remote_src: true
    mode: "0755"
  when: not node_exporter_binary.stat.exists

- name: Remove extracted release directory
  file:
    path: "/opt/node_exporter-{{ node_exporter_version }}.linux-{{ node_exporter_arch }}"
    state: absent
  when: not node_exporter_binary.stat.exists

- name: Install node_exporter systemd unit
  copy:
    dest: /etc/systemd/system/node_exporter.service
    content: |
      [Unit]
      Description=Prometheus Node Exporter
      After=network.target

      [Service]
      User=node_exporter
      Group=node_exporter
      ExecStart=/usr/local/bin/node_exporter
      Restart=on-failure

      [Install]
      WantedBy=multi-user.target
    mode: "0644"
  register: node_exporter_unit_changed

- name: Reload systemd daemon
  systemd:
    daemon_reload: true
  when: node_exporter_unit_changed.changed

- name: Enable and start node_exporter service
  systemd:
    name: node_exporter
    enabled: true
    state: started

- name: Debug - node_exporter installed
  debug:
    msg: "node_exporter {{ node_exporter_version }} installed and running (metrics on :9100)"
