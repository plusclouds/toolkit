---
- name: Ensure /etc/plusclouds directory exists
  file:
    path: /etc/plusclouds
    state: directory
    mode: '0755'

- name: Move agent.yaml to /etc/plusclouds/agent.yaml
  command: mv agent.yaml /etc/plusclouds/agent.yaml
  args:
    chdir: "{{ package_dir | default(playbook_dir) }}"

- name: Ensure /var/log/plusclouds directory exists
  file:
    path: /var/log/plusclouds
    state: directory
    mode: '0755'

- name: Ensure /media/plusclouds-config directory exists
  file:
    path: /media/plusclouds-config
    state: directory
    mode: '0755'

- name: Move plusclouds binary to /usr/local/bin/plusclouds-agent
  command: mv plusclouds.service /usr/local/bin/plusclouds-agent
  args:
    chdir: "{{ package_dir | default(playbook_dir) }}"

# `mv` keeps the source mode. The binary arrives from the config ISO copy as
# 0644, so systemd fails every start with status=203/EXEC. Set the mode
# explicitly instead of relying on the source file's bit.
- name: Ensure plusclouds-agent binary is executable
  file:
    path: /usr/local/bin/plusclouds-agent
    owner: root
    group: root
    mode: '0755'

- name: Verify plusclouds-agent binary is executable
  command: test -x /usr/local/bin/plusclouds-agent
  changed_when: false

- name: Move plusclouds-agent.service to /etc/systemd/system
  command: mv plusclouds-agent.service /etc/systemd/system/plusclouds-agent.service
  args:
    chdir: "{{ package_dir | default(playbook_dir) }}"

# `mv` preserves the source SELinux context (e.g. tmp_t from /tmp/pc-config)
# instead of relabeling to systemd_unit_file_t/bin_t. Under enforcing SELinux
# (default on RHEL-family, unlike Ubuntu/Debian) systemd then can't see the
# unit at all, and the agent binary can fail to exec.
- name: Restore SELinux context for plusclouds files (RedHat family)
  command: "restorecon -v {{ item }}"
  loop:
    - /etc/systemd/system/plusclouds-agent.service
    - /usr/local/bin/plusclouds-agent
  when: ansible_facts.os_family == "RedHat"

- name: Reload systemd daemon
  systemd:
    daemon_reload: true

- name: Enable and start plusclouds-agent service
  systemd:
    name: plusclouds-agent
    enabled: true
    state: started
